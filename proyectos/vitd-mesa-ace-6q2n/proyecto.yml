publicar: true

titulo: Mesa de expertos sobre la formulación de vitamina D
subtitulo: >-
  Lo que respondió el panel frente a lo que muestra la evidencia, en 14 temas más allá del hueso.
  Borrador del informe en revisión por el panel.
cliente: Asociación Colombiana de Endocrinología, Diabetes y Metabolismo (ACE)
codigo: VITD-2026
inicio: 2026-10
fase: Ejecución

