ahora:
  titulo: Revisión del borrador del informe
  texto: >-
    Lea el borrador del informe y responda las cinco preguntas para validar, en la sección «Después de la sesión».
    Para cada una basta con decir si refleja su opinión, si la refleja con cambios o si no la refleja. Puede responder
    por WhatsApp o por correo. El borrador completo, con membrete de la ACE, está en documentos.
  plazo: 2026-11-25

cronograma:
  - fecha: 2026-10-26
    hito: Firma del acta de inicio
    estado: hecho
  - fecha: 2026-10-28
    hito: Envío del formulario individual al panel
    estado: hecho
  - fecha: 2026-11-04
    hito: Cierre del formulario (6 de 7 respuestas)
    estado: hecho
  - fecha: 2026-11-08
    hito: "Análisis de respuestas y contraste con la literatura: 74 estudios en 14 temas, con evaluación de calidad"
    estado: hecho
  - fecha: 2026-11-08
    hito: Prelectura disponible en este sitio
    estado: hecho
  - fecha: 2026-11-13
    hito: Sesión presencial de la mesa
    estado: hecho
  - fecha: 2026-11-17
    hito: "Formulario de cierre: semáforos (7 de 7), votos para EMC, drivers e investigación (6 de 7)"
    estado: hecho
  - fecha: 2026-11-21
    hito: Borrador del informe y preguntas para validar, en revisión por el panel hasta el 25 de noviembre
    estado: en-curso
  - fecha: 2026-11-27
    hito: Informe final para la ACE y su aliado estratégico, después de la revisión del panel (fecha por confirmar)
    estado: pendiente

documentos:
  - archivo: Borrador_informe_mesa_vitD.pdf
    titulo: Borrador del informe (PDF)
    descripcion: Versión para revisión del panel (21 de noviembre). Resultados por tema, mensajes por eje, mapa de drivers, agenda de investigación y propuesta de currículo de EMC. Los cinco puntos para validar están marcados en el texto.
  - archivo: Fichas_evidencia_vitD.pdf
    titulo: Fichas de evidencia (PDF)
    descripcion: Versión 1.0 (8 de noviembre). El resumen, los resultados del panel, las 14 fichas, las preguntas para la sesión y las referencias en un solo documento, para leer sin conexión o imprimir.
  - archivo: Anexo_tecnico_evidencia_por_tema_vitD.xlsx
    titulo: Anexo técnico (Excel)
    descripcion: Una hoja por tema con cada estudio, su diseño, su calidad y sus resultados, con la cita textual del artículo de donde sale cada cifra.
  - archivo: Referencias_incluidas_vitD.xlsx
    titulo: Referencias incluidas (Excel)
    descripcion: Los 74 estudios del corpus, por código, con DOI, PubMed, tipo de estudio, calidad y temas a los que aportan.

novedades:
  - fecha: 2026-11-21
    texto: Se publica el borrador del informe con los resultados de la sesión y cinco preguntas para validar. Plazo para responder, 25 de noviembre.
  - fecha: 2026-11-08
    texto: Se publica la prelectura con las 14 fichas de evidencia y los resultados del formulario del panel.

contacto: cbuiles@festinalente.cc
