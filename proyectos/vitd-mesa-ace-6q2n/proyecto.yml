ahora:
  titulo: Prelectura para la sesión del 13 de noviembre
  texto: >-
    Empiece por el resumen de los 14 temas y la página con lo que respondió el panel. Luego lea las fichas de los
    temas que más le interesen y las cinco preguntas para la sesión. No hay que responder nada: la discusión es
    presencial. Si prefiere leer sin conexión, descargue las fichas en PDF.
  plazo: 2026-11-13

