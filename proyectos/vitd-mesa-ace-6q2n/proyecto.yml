    estado: pendiente

documentos:
  - archivo: Fichas_evidencia_vitD.pdf
    titulo: Fichas de evidencia (PDF)
    descripcion: Versión 1.0 (8 de noviembre). El resumen, los resultados del panel, las 14 fichas, las preguntas para la sesión y las referencias en un solo documento, para leer sin conexión o imprimir.
  - archivo: Anexo_tecnico_evidencia_por_tema_vitD.xlsx
    titulo: Anexo técnico (Excel)
    descripcion: Una hoja por tema con cada estudio, su diseño, su calidad y sus resultados, con la cita textual del artículo de donde sale cada cifra.
  - archivo: Referencias_incluidas_vitD.xlsx
    titulo: Referencias incluidas (Excel)
    descripcion: Los 74 estudios del corpus, por código, con DOI, PubMed, tipo de estudio, calidad y temas a los que aportan.

novedades:
  - fecha: 2026-11-08
    texto: Se publica la prelectura con las 14 fichas de evidencia y los resultados del formulario del panel.

