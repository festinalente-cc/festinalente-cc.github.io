ahora:
  titulo: Revisión del borrador del informe
  texto: >-
    Lea el borrador del informe y responda el formulario de validación: seis preguntas, unos 5 minutos.
    En cada punto basta con decir si el texto refleja su opinión, si la refleja con cambios o si no la refleja.
    El borrador completo, con membrete de la ACE, está en documentos.
  plazo: 2026-11-22
  enlace: validacion/
  boton: Responder la validación

