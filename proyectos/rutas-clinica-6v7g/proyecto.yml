# El panel no se publica: las calificaciones se identifican solo con un código (P01 a P05)
# y la relación entre nombre y código la conoce únicamente la coordinación.

ahora:
  titulo: Ronda 2 abierta hasta el lunes 30 de noviembre
  texto: >-
    En la reunión del 23 de noviembre el panel decidió recalificar solo los 19 ítems que quedaron indeterminados en la ronda 1.
    Los demás conservan su resultado. Antes de calificar, lea la relatoría de la reunión: resume los argumentos de cada ítem y aclara cómo leer los que se entendieron de dos maneras.
    Use el mismo código de panelista; su calificación de la ronda 1 está en su cuadernillo individual.
  archivo: Relatoria_reunion_23nov.pdf
  boton: Leer la relatoría de la reunión (PDF)

