titulo: "Hipoparatiroidismo crónico: mal control y candidatura a reemplazo con PTH"
subtitulo: Declaración de posición de la ACE desarrollada con el método RAND/UCLA
cliente: Asociación Colombiana de Endocrinología, Diabetes y Metabolismo (ACE)
inicio: 2026
fase: Ejecución
contacto: cbuiles@festinalente.cc

# Bloque destacado al inicio de la página
ahora:
  titulo: La revisión 2 del manuscrito está lista para su aprobación
  texto: >-
    Incorpora los 17 comentarios y los 6 textos resaltados de la segunda
    ronda de revisión, y un párrafo nuevo en la discusión sobre las
    complicaciones del tratamiento convencional. Antes de abrir el documento,
    lea el resumen de cambios más abajo y la matriz de cambios. Envíe su
    aprobación u observaciones por correo, por WhatsApp o como comentarios en
    el archivo de Word.
  plazo: 2026-11-13   # 72 horas desde la entrega del 10 de noviembre
  archivo: hipoparatiroidismo-ACE-revision2-2026-11-10.docx
  boton: Abrir la revisión 2 (Word)

