titulo: "Hipoparatiroidismo crónico: mal control y candidatura a reemplazo con PTH"
subtitulo: Declaración de posición de la ACE desarrollada con el método RAND/UCLA
cliente: Asociación Colombiana de Endocrinología, Diabetes y Metabolismo (ACE)
inicio: 2026
fase: Ejecución
contacto: cbuiles@festinalente.cc

# Bloque destacado al inicio de la página
ahora:
  titulo: El panel aprobó la revisión 2
  texto: >-
    Gracias. La versión aprobada incorpora los dos puntos abiertos: el recuadro
    de mensajes clave al inicio y la referencia sobre el exceso de hormonas
    tiroideas y la absorción de calcio en el Recuadro 1. El siguiente paso es la
    consulta al Comité de Tiroides y Paratiroides de la ACE; la versión final
    solo tendrá los ajustes que resulten de esa consulta.
  archivo: hipoparatiroidismo-ACE-version-aprobada-2026-11-11.docx
  boton: Abrir la versión aprobada (Word)

