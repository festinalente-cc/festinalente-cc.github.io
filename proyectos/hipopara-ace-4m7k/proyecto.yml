    archivo: hipoparatiroidismo-ACE-revision2-2026-11-10.docx
    nota: Incorpora la segunda ronda de comentarios del panel. Pendiente de aprobación del panel.
  - nombre: Revisión 1
    fecha: 2026-11-07
    estado: superada
    archivo: hipoparatiroidismo-ACE-revision1-2026-11-07.docx
