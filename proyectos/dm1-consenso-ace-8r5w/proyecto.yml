# En la ronda 1 las calificaciones son anónimas para el grupo.

ahora:
  titulo: Registro, conflictos de interés y comentarios a las preguntas
  texto: >-
    Lea las 22 preguntas del consenso y complete el formulario: sus datos para la publicación, su declaración de
    conflictos de interés, sus comentarios a las preguntas y su consentimiento. Se responde una sola vez y toma unos 15 minutos.
  enlace: 01-preguntas/
  boton: Ver las preguntas y responder

