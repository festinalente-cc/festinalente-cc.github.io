publicar: true

titulo: Estándares de cuidado de la enfermedad ocular tiroidea en adultos en Colombia
subtitulo: Panel de expertos con el método de apropiación RAND/UCLA. Material de trabajo del panel, ronda 1.
cliente: Asociación Colombiana de Endocrinología, Diabetes y Metabolismo (ACE)
codigo: EOT-2026
inicio: 2026-09
fin_previsto: 2027-01
fase: Ejecución

equipo_titulo: Equipo del proyecto
