pie_texto: >-
  Escríbanos por correo o por WhatsApp. Este espacio es para los miembros del Comité de
  Tiroides y Paratiroides de la ACE; por favor no comparta el enlace fuera del comité.
mensaje: |-
  Estimado(a) miembro del Comité de Tiroides y Paratiroides de la ACE:
  Lo invitamos a opinar sobre la declaración de posición de la ACE sobre hipoparatiroidismo crónico y candidatura a reemplazo con PTH. Son 8 fichas breves y unos 10 minutos:
  {url}
  {plazo}
  Gracias por su aporte.

